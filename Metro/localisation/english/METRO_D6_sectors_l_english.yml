 metro_d6_sector.1.t:0 "The Gates of Д-6"
 metro_d6_sector.1.d:0 "The great hermetic doors have finally yielded. Beyond the vestibule, our lamps sweep across marble floors laid for generals who never arrived. The air is stale but breathable, and the tunnels descend further into darkness. Д-6 is open to us."
 metro_d6_sector.1.a:0 "The way is open."
 metro_d6_sector.2.t:0 "Empty Bunks"
 metro_d6_sector.2.d:0 "Row upon row of bunks, lockers still holding pressed uniforms, a mess hall with tables laid for a thousand. The garrison this place was built for never took up its post. A handful of stragglers who found their way in over the years have been... dealt with. The barracks are ours now."
 metro_d6_sector.2.a:0 "Room for our own."
 metro_d6_sector.3.t:0 "The Command Post"
 metro_d6_sector.3.d:0 "Banks of consoles beneath a map of a country that no longer exists. From this room, the old regime meant to fight and win a war after the war. The generators cough back to life one by one, and screens that have slept for a generation flicker awake under our hands."
 metro_d6_sector.3.a:0 "Now we give the orders."
 metro_d6_sector.4.t:0 "Voices in the Wires"
 metro_d6_sector.4.d:0 "The communications hub is intact — switchboards, encrypted lines, antenna feeds threading up through the bedrock to the dead city above. Our radiomen swear they caught a fragment of a signal on the old frequencies. Static, probably. Probably."
 metro_d6_sector.4.a:0 "Keep listening."
 metro_d6_sector.5.t:0 "Stores for a Century"
 metro_d6_sector.5.d:0 "Crates to the ceiling: preserved rations, medicine, filters, boots, ammunition in greased paper. Some of it has spoiled, but far from all. What the Metro has fought and died over for decades sits here in quantities no station has ever seen."
 metro_d6_sector.5.a:0 "Distribute the supplies."
 metro_d6_sector.6.t:0 "Iron Horses"
 metro_d6_sector.6.d:0 "The hangar doors rolled back to reveal them: trucks, transporters, engineering vehicles — even a pair of armoured cars, dusted but whole, waiting in perfect ranks. Fuel is another matter, but our mechanics are already crawling over the machines like ants on sugar."
 metro_d6_sector.6.a:0 "Get them running."
 metro_d6_sector.7.t:0 "The Arsenal"
 metro_d6_sector.7.d:0 "Racks of rifles still in their cosmoline, crates of grenades, heavy weapons our soldiers have only seen in pre-war picture books. The arsenal of Д-6 is real — not the fairy tale traders tell over campfires. Whoever holds this holds the balance of power in the Metro."
 metro_d6_sector.7.a:0 "Arm the men."
 metro_d6_sector.8.t:0 "The Heart Still Beats"
 metro_d6_sector.8.d:0 "The reactor complex answered our engineers like an old soldier answering a bugle. Cooling loops hold pressure; the control rods slide true. With this much power we can light halls that have stood dark since the bombs fell — and drive machines the Metro has only dreamed of."
 metro_d6_sector.8.a:0 "Bring it to full power."
 metro_d6_sector.9.t:0 "Behind Sealed Doors"
 metro_d6_sector.9.d:0 "The laboratories were locked from the outside — every door, every bulkhead. Inside: specimen jars, incubators, and documentation our scholars refuse to summarise aloud. We have taken what is useful and welded shut what is not. Some knowledge is a weapon; some is a disease."
 metro_d6_sector.9.a:0 "Take what serves us. Seal the rest."
 metro_d6_sector.10.t:0 "The Deep Vault"
 metro_d6_sector.10.d:0 "At the very bottom of Д-6, past the last blast door, lies the chamber the whole complex was built to protect. Launch keys. Target ledgers. The cold arithmetic of the old world's final argument, preserved in perfect order. We descended looking for salvation. We must now decide what we have actually found."
 metro_d6_sector.10.a:0 "The Metro must never know."
